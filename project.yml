name: MonoCl
options:
  bundleIdPrefix: net.sinistral
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"

packages:
  Indicators:
    path: Packages/Indicators
  ClaudeUsage:
    path: Packages/ClaudeUsage
  PlatformStatus:
    path: Packages/PlatformStatus
  Engine:
    path: Packages/Engine
  AppUpdate:
    path: Packages/AppUpdate

targets:
  MonoCl:
    type: application
    platform: macOS
    sources:
      - path: MonoCl
    info:
      path: MonoCl/Info.plist
      properties:
        # Menu bar only: no Dock icon, no main window.
        LSUIElement: true
        CFBundleName: MonoCl
        CFBundleIconName: AppIcon
        CFBundleDisplayName: MonoCl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.sinistral.monocl
        # Signed with a stable self-signed identity, created through
        # Keychain Access as the README describes.  Not a Developer ID:
        # nothing here is distributed, so Gatekeeper never sees it.
        #
        # Making the keychain grant for Claude Code's credential survive
        # a rebuild is why this identity was configured, and it does not
        # achieve that.  The designated requirement it produces names the
        # leaf certificate rather than the cdhash, but the keychain's ACL
        # matches per binary rather than against that requirement, so a
        # rebuild asks again either way -- measured, and written up under
        # "Why keychain access is required" in the README.  An ad-hoc
        # "-" identity would behave identically and need no setup.
        #
        # The App Sandbox is deliberately absent - a sandboxed app cannot
        # read another app's keychain item, which is the whole feature.
        CODE_SIGN_IDENTITY: "MonoCl Self-Signed"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - package: Indicators
      - package: ClaudeUsage
      - package: PlatformStatus
      - package: Engine
      - package: AppUpdate

  MonoClTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MonoClTests
    settings:
      base:
        # No hand-authored Info.plist for the test bundle; let Xcode
        # synthesize the minimal one a unit-test bundle needs to sign.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MonoCl

schemes:
  MonoCl:
    build:
      targets:
        MonoCl: all
        MonoClTests: [test]
    test:
      targets:
        - MonoClTests
      # The test bundle is hosted by the app, so `xcodebuild test`
      # launches MonoCl and `applicationDidFinishLaunching` runs before
      # any test does.  Neither of the things it starts has any business
      # running here: the host should not read a real credential, and
      # the suites are offline by construction, so it should not reach
      # api.github.com either.  Each is given the state that is true of
      # the host -- there is no credential, and there is no update check.
      environmentVariables:
        MONOCL_FAKE_CREDENTIAL: not-found
        MONOCL_SKIP_UPDATE_CHECK: "1"
