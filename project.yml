name: MonoCl
options:
  bundleIdPrefix: net.sinistral
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "4"

packages:
  Indicators:
    path: Packages/Indicators
  ClaudeUsage:
    path: Packages/ClaudeUsage
  PlatformStatus:
    path: Packages/PlatformStatus
  Engine:
    path: Packages/Engine
  AppUpdate:
    path: Packages/AppUpdate

targets:
  MonoCl:
    type: application
    platform: macOS
    sources:
      - path: MonoCl
    info:
      path: MonoCl/Info.plist
      properties:
        # Menu bar only: no Dock icon, no main window.
        LSUIElement: true
        CFBundleName: MonoCl
        CFBundleIconName: AppIcon
        CFBundleDisplayName: MonoCl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.sinistral.monocl
        # Ad-hoc signing: a personal tool, not distributed, so Gatekeeper
        # never sees it.  No keychain grant depends on the signature,
        # because the credential is read through /usr/bin/security --
        # see "Why keychain access is required" in the README.  A
        # self-signed identity was tried for that grant and bought
        # nothing.
        #
        # The App Sandbox is deliberately absent - a sandboxed app cannot
        # read another app's keychain item, which is the whole feature.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - package: Indicators
      - package: ClaudeUsage
      - package: PlatformStatus
      - package: Engine
      - package: AppUpdate

  MonoClTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MonoClTests
    settings:
      base:
        # No hand-authored Info.plist for the test bundle; let Xcode
        # synthesize the minimal one a unit-test bundle needs to sign.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MonoCl

schemes:
  MonoCl:
    build:
      targets:
        MonoCl: all
        MonoClTests: [test]
    test:
      targets:
        - MonoClTests
      # The test bundle is hosted by the app, so `xcodebuild test`
      # launches MonoCl and `applicationDidFinishLaunching` runs before
      # any test does.  Neither of the things it starts has any business
      # running here: the host should not read a real credential, and
      # the suites are offline by construction, so it should not reach
      # api.github.com either.  Each is given the state that is true of
      # the host -- there is no credential, and there is no update check.
      environmentVariables:
        MONOCL_FAKE_CREDENTIAL: not-found
        MONOCL_SKIP_UPDATE_CHECK: "1"
