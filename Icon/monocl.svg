<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    MonoCl app icon.  Source of truth; Scripts/make-app-icon.sh
    rasterizes it into MonoCl/Assets.xcassets/AppIcon.appiconset.

    A stylised monocle, not a picture of one: a rim, an eyelet, and the
    Claude flare as the subject in the glass.  The chain a real monocle
    hangs from is deliberately absent.  It was drawn and rejected: fine
    links read as dirt on the glass at 64pt and vanish entirely by
    32pt, so the detail cost legibility at the sizes the icon is
    actually used and bought nothing at the size it is not.

    The flare is a redrawing of Anthropic's mark rather than their
    artwork, softer in the spokes and set in a slightly different clay.
    It is still their mark for trademark purposes, since redrawing
    changes how it looks and not whose it is, so the scope note at the
    foot of LICENSE still applies.

    The artwork is authored in a 540-unit space and placed here by one
    transform, so the drawing can be edited in those units without
    touching the icon geometry.
  -->
  <defs>
    <!-- The monocle is a single outline with counter-paths punched
         through it, so the chain cannot be removed by dropping a
         subpath: its geometry is part of the same outline as the rim.
         Everything right of x=430 is clipped away instead, which takes
         the chain and the eyelet together, and the eyelet is redrawn
         below.  Clipping alone left the eyelet-to-chain connector
         behind as a stub, and no clip that removed the stub spared the
         eyelet's ring. -->
    <clipPath id="no-chain" clipRule="evenodd">
      <path clip-rule="evenodd" d="M0 0 H540 V540 H0 Z M430 0 H540 V540 H430 Z"/>
    </clipPath>
  </defs>

  <!-- The 824pt rounded square centred in the 1024pt canvas: the
       conventional macOS proportion, leaving the 100pt margin the
       platform's icons carry.  Checked only by eye, against the image
       NSWorkspace returns for the built app. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#FFFFFF"/>

  <g transform="translate(512,512) scale(1.57955) translate(-281.9,-206.8)">
    <g clip-path="url(#no-chain)">
